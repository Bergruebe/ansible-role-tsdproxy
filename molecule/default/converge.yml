---
- name: Include roles for TSDProxy Molecule tests
  hosts: all
  become: true
  gather_facts: true
  tasks:
    # `tsdproxy_gid` is derived from this, so it has to run before the role is
    # included. TSDProxy is given the Docker socket, and a non-root container
    # uid can only open a root:docker 0660 socket by being in that group.
    - name: Look up the Docker group for TSDProxy Molecule tests
      ansible.builtin.getent:
        database: group
        key: docker

    - name: Include roles for TSDProxy Molecule tests
      ansible.builtin.include_role:
        name: "{{ role_name }}"
        public: true
      loop:
        - com.devture.ansible.role.playbook_help
        - com.devture.ansible.role.systemd_docker_base
        - "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | basename }}"
      loop_control:
        loop_var: role_name

- name: Ensure TSDProxy service is started
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Ensure systemd daemon is reloaded
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Ensure TSDProxy systemd service is started
      ansible.builtin.systemd_service:
        name: tsdproxy.service
        state: started
